<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Puzzle Room</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1e1e2e; color:#cdd6f4;
         display:flex; flex-direction:column; align-items:center; padding:40px 20px; }
  h1 { margin:0 0 8px; }
  .subtitle { color:#a6adc8; margin-bottom:24px; }

  .name-block { width:100%; max-width:720px; margin-bottom:24px; }
  .name-block label { display:block; font-size:13px; color:#a6adc8; margin-bottom:6px; }
  .name-block input { width:100%; padding:12px 14px; border-radius:8px; border:none;
                      font-size:16px; box-sizing:border-box; background:#313244;
                      color:#cdd6f4; }
  .name-block input::placeholder { color:#6c7086; }

  .games-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
                gap:16px; width:100%; max-width:720px; }
  .game-card { background:#313244; border-radius:12px; padding:20px;
               text-align:center; }
  .game-card h3 { margin:0 0 8px; font-size:18px; }
  .game-card .desc { min-height:32px; margin:0 0 12px; font-size:12px;
                     line-height:1.35; color:#a6adc8; }
  .game-card .actions { display:flex; gap:8px; flex-direction:column; }

  /* поле комнаты — намеренно неброское */
  .game-card label { font-size:11px; color:#6c7086; text-align:left;
                     display:block; margin-bottom:2px; font-style:italic; }
  .game-card input.room-input {
    padding:5px 8px; border-radius:6px; border:1px solid #45475a;
    background:transparent; color:#7f849c; font-size:12px; font-style:italic;
    box-sizing:border-box; width:100%;
  }
  .game-card input.room-input:focus {
    outline:none; border-color:#89b4fa; color:#cdd6f4; font-style:normal;
  }

  .game-card button { padding:10px 16px; background:#89b4fa; color:#1e1e2e;
                      border:none; border-radius:8px; font-weight:bold;
                      cursor:pointer; }
  .game-card button:disabled { background:#585b70; color:#a6adc8; cursor:not-allowed; }
  .hint { font-size:12px; color:#a6adc8; margin-top:6px; }
</style>
</head>
<body>

<h1>Puzzle Room</h1>
<div class="subtitle">Выберите головоломку и комнату</div>

<div class="name-block">
  <label for="playerName">Ваше имя (необязательно, но с ним удобнее)</label>
  <input id="playerName" maxlength="30" placeholder="Например, Маша" />
</div>

<div class="games-grid" id="gamesGrid">Загрузка...</div>

<script>
const grid = document.getElementById('gamesGrid');
const nameInput = document.getElementById('playerName');

// подхватываем имя из прошлой сессии
nameInput.value = sessionStorage.getItem('pr_name') || '';

nameInput.addEventListener('input', () => {
  const val = nameInput.value.trim();
  if (val) sessionStorage.setItem('pr_name', val);
  else sessionStorage.removeItem('pr_name');
  // обновляем поля комнат у всех карточек
  document.querySelectorAll('.room-input').forEach(inp => {
    inp.value = val || randomRoom();
    inp.dataset.autoFilled = val ? '1' : '0';
  });
});

function randomRoom() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

fetch('/api/games')
  .then(r => r.json())
  .then(games => {
    grid.innerHTML = '';
    if (!games.length) {
      grid.textContent = 'Пока нет доступных игр.';
      return;
    }
    const currentName = nameInput.value.trim();
    for (const game of games) {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <h3>${escapeHtml(game.title)}</h3>
        <p class="desc">${escapeHtml(game.description || '')}</p>
        <div class="actions">
          <label for="room-${game.id}">комната</label>
          <input class="room-input" id="room-${game.id}" maxlength="40" />
          <button id="btn-${game.id}">Играть</button>
        </div>
        <div class="hint">По умолчанию у каждого своя комната. Чтобы играть вместе — введите одно и то же название.</div>
      `;
      grid.appendChild(card);

      const input = card.querySelector(`#room-${game.id}`);
      const btn = card.querySelector(`#btn-${game.id}`);

      // если имя введено — ставим его; иначе случайное значение
      input.value = currentName || randomRoom();

      function go() {
        const name = nameInput.value.trim();
        if (name) sessionStorage.setItem('pr_name', name);
        const room = input.value.trim() || randomRoom();
        location.href = `/play.html?game=${encodeURIComponent(game.id)}&room=${encodeURIComponent(room)}`;
      }

      btn.addEventListener('click', go);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }
  })
  .catch(err => {
    grid.textContent = 'Не удалось загрузить список игр: ' + err.message;
  });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
</script>
</body>
</html>
