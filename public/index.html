<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Puzzle Room</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1e1e2e; color:#cdd6f4;
         display:flex; flex-direction:column; align-items:center; padding:40px 20px; }
  h1 { margin:0 0 8px; }
  .subtitle { color:#a6adc8; margin-bottom:28px; }
  .games-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
                gap:16px; width:100%; max-width:720px; }
  .game-card { background:#313244; border-radius:12px; padding:20px;
               text-align:center; }
  .game-card h3 { margin:0 0 12px; font-size:18px; }
  .game-card .actions { display:flex; gap:8px; flex-direction:column; }
  .game-card label { font-size:12px; color:#a6adc8; text-align:left; display:block; }
  .game-card input { padding:10px; border-radius:8px; border:none;
                     font-size:14px; box-sizing:border-box; }
  .game-card button { padding:10px 16px; background:#89b4fa; color:#1e1e2e;
                      border:none; border-radius:8px; font-weight:bold;
                      cursor:pointer; }
  .game-card button:disabled { background:#585b70; color:#a6adc8; cursor:not-allowed; }
  .hint { font-size:12px; color:#a6adc8; margin-top:6px; }
</style>
</head>
<body>

<h1>Puzzle Room</h1>
<div class="subtitle">Выберите головоломку и комнату</div>
<div class="games-grid" id="gamesGrid">Загрузка...</div>

<script>
const grid = document.getElementById('gamesGrid');

// 6 символов: a-z, 0-9
function randomRoom() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

fetch('/api/games')
  .then(r => r.json())
  .then(games => {
    grid.innerHTML = '';
    if (!games.length) {
      grid.textContent = 'Пока нет доступных игр.';
      return;
    }
    for (const game of games) {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <h3>${escapeHtml(game.title)}</h3>
        <div class="actions">
          <label for="room-${game.id}">Комната (можно изменить)</label>
          <input id="room-${game.id}" maxlength="40" />
          <button id="btn-${game.id}">Играть</button>
        </div>
        <div class="hint">По умолчанию у каждого своя комната. Чтобы играть вместе — введите одно и то же название.</div>
      `;
      grid.appendChild(card);

      const input = card.querySelector(`#room-${game.id}`);
      const btn = card.querySelector(`#btn-${game.id}`);

      // предзаполняем случайным значением, но не затираем, если игрок уже что-то ввёл
      input.value = randomRoom();

      function go() {
        const room = input.value.trim() || randomRoom();
        location.href = `/play.html?game=${encodeURIComponent(game.id)}&room=${encodeURIComponent(room)}`;
      }

      btn.addEventListener('click', go);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }
  })
  .catch(err => {
    grid.textContent = 'Не удалось загрузить список игр: ' + err.message;
  });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
</script>
</body>
</html>
