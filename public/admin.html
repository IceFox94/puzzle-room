<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Puzzle Room · Админ</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1e1e2e; color:#cdd6f4;
         padding:20px; }
  h1 { margin-top:0; }
  .crumbs { color:#a6adc8; font-size:14px; margin-bottom:16px; }
  .crumbs a { color:#89b4fa; cursor:pointer; text-decoration:none; }

  .games-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
                gap:16px; }
  .game-card { background:#313244; border-radius:12px; padding:20px;
               cursor:pointer; text-align:center; font-size:18px; font-weight:bold; }
  .game-card:hover { outline:1px solid #89b4fa; }
  .game-card.disabled { opacity:0.6; }
  .game-card .count { display:block; font-size:13px; font-weight:normal;
                      color:#a6adc8; margin-top:6px; }
  .game-toggle { display:flex; align-items:center; justify-content:center; gap:6px;
                 margin-bottom:10px; font-size:12px; font-weight:normal;
                 color:#a6adc8; cursor:pointer; }
  .game-toggle input { width:16px; height:16px; accent-color:#a6e3a1;
                       cursor:pointer; }
  .game-card.disabled .game-toggle { color:#f9e2af; }
  .game-difficulty { display:flex; align-items:center; justify-content:center; gap:6px;
                     margin-bottom:10px; font-size:12px; font-weight:normal;
                     color:#a6adc8; }
  .game-difficulty select { padding:4px 6px; border-radius:6px;
                            border:1px solid #45475a; background:#1e1e2e;
                            color:#cdd6f4; font-size:12px; cursor:pointer; }

  .rooms-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
                gap:16px; }
  .room-card { background:#313244; border-radius:12px; padding:16px; cursor:pointer; }
  .room-card:hover { outline:1px solid #89b4fa; }
  .room-card h3 { margin:0 0 8px; font-size:16px; }
  .room-card .solved { color:#a6e3a1; }
  .room-card .open { color:#f9e2af; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7);
           display:none; align-items:center; justify-content:center; z-index:10; }
  .modal.open { display:flex; }
  .modal-box { background:#1e1e2e; padding:24px; border-radius:12px;
               max-width:90vw; max-height:90vh; overflow:auto; }
  .modal-box h2 { margin:0 0 8px; }
  .modal-box .sub { color:#a6adc8; margin-bottom:16px; font-size:14px; }

  .players-list { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .player-row { background:#313244; border-radius:8px; padding:8px 12px;
                cursor:pointer; display:flex; justify-content:space-between;
                gap:12px; }
  .player-row:hover { outline:1px solid #89b4fa; }
  .player-row .win { color:#a6e3a1; font-size:12px; text-align:right; }

  #viewBoard { display:flex; justify-content:center; align-items:flex-end;
               padding:20px; background:#313244; border-radius:12px; min-height:280px; }
  .rod { width:150px; height:240px; display:flex; flex-direction:column-reverse;
         align-items:center; justify-content:flex-start; position:relative;
         padding-bottom:10px; }
  .rod::before { content:""; position:absolute; bottom:10px; width:8px;
                 height:210px; background:#6c7086; border-radius:4px; }
  .disk { height:22px; border-radius:6px; position:relative; z-index:1; margin-bottom:2px; }
  .lo-grid { display:grid; gap:6px; }
  .lo-cell { width:40px; height:40px; border-radius:6px; background:#45475a; }
  .lo-cell.on { background:#f9e2af; }
  .sep-svg { width:320px; height:320px; display:block; }
  .nl-svg { width:320px; height:320px; display:block; }

  button { margin-top:16px; padding:10px 20px; background:#89b4fa; color:#1e1e2e;
           border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<h1>Puzzle Room · Админ</h1>
<div class="crumbs" id="crumbs"></div>
<div id="content"></div>

<div class="modal" id="roomModal">
  <div class="modal-box">
    <h2 id="modalTitle">Комната</h2>
    <div class="sub" id="modalSub"></div>
    <div class="players-list" id="playersList"></div>
    <div id="viewBoard"></div>
    <button id="modalClose">Закрыть</button>
  </div>
</div>

<div class="modal" id="playerModal">
  <div class="modal-box">
    <h2 id="playerTitle">Игрок</h2>
    <div class="sub" id="playerSub"></div>
    <button id="playerClose">Закрыть</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const COLORS = ['#f38ba8','#fab387','#f9e2af','#a6e3a1','#89b4fa','#cba6f7'];

let data = { games: [], rooms: {} };
let currentGame = null;
let currentRoom = null;

socket.emit('admin:subscribe');

socket.on('admin:update', (d) => {
  data = d;
  render();
});

function render() {
  if (!currentGame) renderGames();
  else renderRooms();
  renderCrumbs();
}

function renderCrumbs() {
  const crumbs = document.getElementById('crumbs');
  if (!currentGame) { crumbs.innerHTML = ''; return; }
  const game = data.games.find(g => g.id === currentGame);
  crumbs.innerHTML =
    `<a id="backGames">Все игры</a> · ${game ? game.title : currentGame}`;
  document.getElementById('backGames').addEventListener('click', () => {
    currentGame = null;
    currentRoom = null;
    render();
  });
}

function renderGames() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="games-grid" id="gamesGrid"></div>';
  const grid = document.getElementById('gamesGrid');
  for (const game of data.games) {
    const rooms = data.rooms[game.id] || [];
    const active = rooms.filter(r => r.players.length > 0).length;
    const card = document.createElement('div');
    card.className = 'game-card' + (game.enabled ? '' : ' disabled');
    const difficultyControl = game.id === 'numberlink' && Array.isArray(game.difficulties)
      ? `
      <label class="game-difficulty" title="Сложность для новых комнат Numberlink">
        <span>Сложность</span>
        <select class="difficulty-select">
          ${game.difficulties.map(d =>
            `<option value="${escapeHtml(d.id)}"${d.id === game.difficulty ? ' selected' : ''}>${escapeHtml(d.label)}</option>`
          ).join('')}
        </select>
      </label>`
      : '';
    card.innerHTML = `
      <label class="game-toggle" title="Снимите галочку, чтобы заблокировать игру для игроков">
        <input type="checkbox"${game.enabled ? ' checked' : ''} />
        <span>${game.enabled ? 'Доступна' : 'Заблокирована'}</span>
      </label>
      ${difficultyControl}
      <div class="game-title">${escapeHtml(game.title)}</div>
      <span class="count">Комнат: ${rooms.length} · Активных: ${active}</span>
    `;

    const toggle = card.querySelector('.game-toggle');
    const checkbox = card.querySelector('input');
    toggle.addEventListener('click', (event) => event.stopPropagation());
    checkbox.addEventListener('change', () => {
      socket.emit('admin:set-game-enabled', {
        gameId: game.id,
        enabled: checkbox.checked,
      }, (res) => {
        if (!res || res.error) {
          checkbox.checked = !checkbox.checked;
          alert(res && res.error || 'Не удалось изменить доступность игры.');
        }
      });
    });

    const difficulty = card.querySelector('.game-difficulty');
    const difficultySelect = card.querySelector('.difficulty-select');
    if (difficulty) {
      difficulty.addEventListener('click', (event) => event.stopPropagation());
    }
    if (difficultySelect) {
      difficultySelect.addEventListener('change', () => {
        socket.emit('admin:set-numberlink-difficulty', {
          difficulty: difficultySelect.value,
        }, (res) => {
          if (!res || res.error) {
            alert(res && res.error || 'Не удалось изменить сложность.');
          }
        });
      });
    }

    card.addEventListener('click', () => {
      currentGame = game.id;
      currentRoom = null;
      render();
    });
    grid.appendChild(card);
  }
}

function renderRooms() {
  const content = document.getElementById('content');
  const rooms = data.rooms[currentGame] || [];
  content.innerHTML = '<div class="rooms-grid" id="roomsGrid"></div>';
  const grid = document.getElementById('roomsGrid');
  if (!rooms.length) {
    content.innerHTML = '<div style="color:#a6adc8;">Пока нет комнат в этой игре.</div>';
    return;
  }
  for (const room of rooms) {
    const card = document.createElement('div');
    card.className = 'room-card';
    const status = room.solved
      ? '<span class="solved">Решено</span>'
      : '<span class="open">В процессе</span>';
    const difficultyText = room.gameId === 'numberlink' && room.difficulty
      ? `<div style="font-size:13px;color:#a6adc8;margin-top:4px;">
           Сложность: ${escapeHtml(difficultyLabel(room.difficulty))}
         </div>`
      : '';
    card.innerHTML = `
      <h3>${escapeHtml(room.roomId)}</h3>
      <div>${status}</div>
      <div style="font-size:13px;color:#a6adc8;margin-top:6px;">
        Игроков: ${room.players.length}
        ${room.players.length ? '· ' + room.players.map(p => escapeHtml(p.name)).join(', ') : ''}
      </div>
      ${difficultyText}
    `;
    card.addEventListener('click', () => openRoom(room.roomId));
    grid.appendChild(card);
  }
}

function difficultyLabel(id) {
  const game = data.games.find(g => g.id === 'numberlink');
  const option = game && Array.isArray(game.difficulties)
    ? game.difficulties.find(d => d.id === id)
    : null;
  return option ? option.label : id;
}

function openRoom(roomId) {
  const room = (data.rooms[currentGame] || []).find(r => r.roomId === roomId);
  if (!room) return;
  currentRoom = room;

  const difficultyText = room.gameId === 'numberlink' && room.difficulty
    ? ` · Сложность: ${difficultyLabel(room.difficulty)}`
    : '';
  document.getElementById('modalTitle').textContent = `Комната: ${room.roomId}`;
  document.getElementById('modalSub').textContent =
    `${room.gameTitle} · ${room.solved ? 'Решено' : 'В процессе'}${difficultyText} · ` +
    `Ходов в комнате: ${room.state.moves ?? 0}`;

  const list = document.getElementById('playersList');
  list.innerHTML = '';
  if (!room.players.length) {
    list.innerHTML = '<div style="color:#a6adc8;font-size:13px;">Пока нет игроков.</div>';
  }
  for (const p of room.players) {
    const row = document.createElement('div');
    row.className = 'player-row';
    const win = p.firstWinAt
      ? `<span class="win">решено в: ${fmtTime(p.firstWinAt)} · за ${fmtMoves(p.solvedMoves)}</span>`
      : '';
    row.innerHTML = `<span>${escapeHtml(p.name)}</span>${win}`;
    row.addEventListener('click', () => openPlayer(room, p.id));
    list.appendChild(row);
  }

  renderBoardForGame(room);
  document.getElementById('roomModal').classList.add('open');
}

function renderBoardForGame(room) {
  const board = document.getElementById('viewBoard');
  board.innerHTML = '';
  if (room.gameId === 'hanoi') {
    const total = room.state.rods.flat().reduce((a, b) => Math.max(a, b), 0) || 4;
    for (let i = 0; i < 3; i++) {
      const rod = document.createElement('div');
      rod.className = 'rod';
      room.state.rods[i].forEach(size => {
        const d = document.createElement('div');
        d.className = 'disk';
        d.style.width = (30 + size * (120 / total)) + 'px';
        d.style.background = COLORS[(size - 1) % COLORS.length];
        rod.appendChild(d);
      });
      board.appendChild(rod);
    }
  } else if (room.gameId === 'lightsout') {
    const grid = document.createElement('div');
    grid.className = 'lo-grid';
    grid.style.gridTemplateColumns = `repeat(${room.state.size}, 40px)`;
    for (let r = 0; r < room.state.size; r++) {
      for (let c = 0; c < room.state.size; c++) {
        const cell = document.createElement('div');
        cell.className = 'lo-cell' + (room.state.grid[r][c] ? ' on' : '');
        grid.appendChild(cell);
      }
    }
    board.appendChild(grid);
  } else if (room.gameId === 'separate') {
    board.appendChild(buildSeparateBoard(room.state));
  } else if (room.gameId === 'numberlink') {
    board.appendChild(buildNumberlinkBoard(room.state));
  }
}

function buildSeparateBoard(state) {
  const NS = 'http://www.w3.org/2000/svg';
  const MIN = -0.5;
  const VIEW = 4;
  const SIZE = 3;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `${MIN} ${MIN} ${VIEW} ${VIEW}`);
  svg.setAttribute('class', 'sep-svg');

  const add = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const key in attrs) el.setAttribute(key, attrs[key]);
    svg.appendChild(el);
    return el;
  };

  add('rect', { x: MIN, y: MIN, width: VIEW, height: VIEW, rx: 0.12, fill: '#292a3a' });
  for (let i = 0; i <= SIZE; i++) {
    add('line', { x1: i, y1: 0, x2: i, y2: SIZE, stroke: '#45475a', 'stroke-width': 0.012 });
    add('line', { x1: 0, y1: i, x2: SIZE, y2: i, stroke: '#45475a', 'stroke-width': 0.012 });
  }
  add('rect', { x: 0, y: 0, width: SIZE, height: SIZE, fill: 'none',
                stroke: '#6c7086', 'stroke-width': 0.03, rx: 0.03 });

  for (let row = 0; row < SIZE; row++) {
    for (let col = 0; col < SIZE; col++) {
      add('path', {
        d: separateStarPath(col + 0.5, row + 0.5, 0.17, 0.072),
        fill: '#f9e2af',
      });
    }
  }

  const squareColor = state.solved ? '#a6e3a1' : '#89b4fa';
  for (const shape of state.shapes) {
    if (shape.type === 'line') {
      add('line', {
        x1: shape.x1, y1: shape.y1, x2: shape.x2, y2: shape.y2,
        stroke: '#7f849c', 'stroke-width': 0.03, 'stroke-linecap': 'round',
      });
    } else if (shape.type === 'square') {
      add('polygon', {
        points: separateSquarePoints(shape),
        fill: 'none', stroke: squareColor, 'stroke-width': 0.045,
        'stroke-linejoin': 'round',
      });
    }
  }

  return svg;
}

function separateSquarePoints(square) {
  const rad = square.rotation * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const h = square.h;
  return [[-h, -h], [h, -h], [h, h], [-h, h]]
    .map(([x, y]) => {
      const rx = x * cos - y * sin + square.cx;
      const ry = x * sin + y * cos + square.cy;
      return `${Math.round(rx * 1000) / 1000},${Math.round(ry * 1000) / 1000}`;
    })
    .join(' ');
}

function separateStarPath(cx, cy, outer, inner) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? outer : inner;
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    d += (i === 0 ? 'M' : 'L') + (Math.round(x * 1000) / 1000) + ' ' + (Math.round(y * 1000) / 1000);
  }
  return d + 'Z';
}

function buildNumberlinkBoard(state) {
  const NS = 'http://www.w3.org/2000/svg';
  const size = state.size;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('class', 'nl-svg');

  const add = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const key in attrs) el.setAttribute(key, attrs[key]);
    svg.appendChild(el);
    return el;
  };

  add('rect', {
    x: 0, y: 0, width: size, height: size,
    rx: 0.08, fill: state.solved ? '#26332f' : '#24273a',
  });

  for (let i = 1; i < size; i++) {
    add('line', {
      x1: i, y1: 0.04, x2: i, y2: size - 0.04,
      stroke: '#3b3d52', 'stroke-width': 0.012,
    });
    add('line', {
      x1: 0.04, y1: i, x2: size - 0.04, y2: i,
      stroke: '#3b3d52', 'stroke-width': 0.012,
    });
  }

  add('rect', {
    x: 0.01, y: 0.01, width: size - 0.02, height: size - 0.02,
    rx: 0.08, fill: 'none',
    stroke: state.solved ? '#a6e3a1' : '#585b70',
    'stroke-width': 0.018,
  });

  for (const pair of state.pairs) {
    const color = numberlinkColor(pair.id);
    const path = state.paths[pair.id];
    if (!Array.isArray(path) || path.length < 2) continue;

    const points = path.map(cell => {
      const p = numberlinkCenter(cell, size);
      return `${p.x},${p.y}`;
    }).join(' ');

    const common = {
      points, fill: 'none',
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    };
    add('polyline', { ...common, stroke: '#1e1e2e', 'stroke-width': 0.30 });
    add('polyline', { ...common, stroke: color, 'stroke-width': 0.19 });
    add('polyline', { ...common, stroke: '#ffffff', 'stroke-width': 0.055, opacity: 0.30 });
  }

  for (const pair of state.pairs) {
    const color = numberlinkColor(pair.id);

    for (const cell of [pair.a, pair.b]) {
      const { x, y } = numberlinkCenter(cell, size);

      add('circle', { cx: x, cy: y, r: 0.44, fill: color, opacity: 0.14 });
      add('circle', {
        cx: x, cy: y, r: 0.31, fill: color,
        stroke: '#1e1e2e', 'stroke-width': 0.03,
      });
      add('circle', {
        cx: x - 0.09, cy: y - 0.10, r: 0.07,
        fill: '#ffffff', opacity: 0.35,
      });

      const text = add('text', {
        x, y: y + 0.01,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        'font-family': 'system-ui, sans-serif',
        'font-size': 0.40,
        'font-weight': 700,
        fill: '#1e1e2e',
      });
      text.textContent = String(pair.id);
    }
  }

  return svg;
}

function numberlinkColor(id) {
  const palette = [
    '#f38ba8', '#89b4fa', '#a6e3a1', '#fab387',
    '#cba6f7', '#94e2d5', '#f9e2af', '#f5c2e7',
  ];
  return palette[(id - 1) % palette.length];
}

function numberlinkCenter(cell, size) {
  return {
    x: (cell % size) + 0.5,
    y: Math.floor(cell / size) + 0.5,
  };
}

function openPlayer(room, playerId) {
  socket.emit('admin:player', {
    gameId: room.gameId, roomId: room.roomId, playerId
  }, (res) => {
    if (!res || res.error) {
      alert(res && res.error || 'Ошибка');
      return;
    }
    document.getElementById('playerTitle').textContent =
      `Игрок: ${res.player.name}`;
    document.getElementById('playerSub').innerHTML = `
      Ходов: <b>${res.player.moves}</b><br>
      Решил: <b>${res.player.solved ? 'да' : 'нет'}</b><br>
      ${res.player.firstWinAt
        ? `Решено в: <b>${fmtTime(res.player.firstWinAt)}</b> · за <b>${fmtMoves(res.player.solvedMoves)}</b>`
        : `Решено в: <b>ещё не было</b>`}
    `;
    document.getElementById('playerModal').classList.add('open');
  });
}

function fmtTime(ts) {
  return new Date(ts).toLocaleString('ru-RU');
}

function fmtMoves(n) {
  if (n == null) return '? ходов';
  return `${n} ${plural(n, ['ход', 'хода', 'ходов'])}`;
}

function plural(n, forms) {
  const n10 = n % 10;
  const n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return forms[0];
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
  return forms[2];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('roomModal').classList.remove('open');
});
document.getElementById('playerClose').addEventListener('click', () => {
  document.getElementById('playerModal').classList.remove('open');
});
document.getElementById('roomModal').addEventListener('click', e => {
  if (e.target.id === 'roomModal')
    document.getElementById('roomModal').classList.remove('open');
});
document.getElementById('playerModal').addEventListener('click', e => {
  if (e.target.id === 'playerModal')
    document.getElementById('playerModal').classList.remove('open');
});
</script>
</body>
</html>
